[project]
name = "ha-csg"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "homeassistant>=2024.4",
  "pycryptodome",
  "brotli",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning:homeassistant.components.http",
]
